package: acpcheckout
output: acpcheckout_gen.go
generate:
  models: true
output-options:
  skip-prune: true
  user-templates:
    imports.tmpl: ../internal/oapi-codegen/imports.tmpl
  exclude-schemas:
    - Error
    - IdempotencyConflict
    - IdempotencyInFlight
    - IdempotencyKeyRequired
  overlay:
    path: oapi-codegen-overlay.yaml
